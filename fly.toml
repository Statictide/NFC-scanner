# fly.toml app configuration file generated for nfc-scanner on 2024-08-25T23:11:57+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nfc-scanner'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = "256mb"

[mounts]
  source = "app_data"
  destination = "/data"
